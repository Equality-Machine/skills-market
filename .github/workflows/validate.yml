name: validate registry

on:
  pull_request:
    paths:
      - "skills/**"
      - "registry/**"
      - "scripts/build-registry.mjs"
      - "scripts/validate-registry.mjs"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "registry/**"
      - "scripts/build-registry.mjs"
      - "scripts/validate-registry.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check registry is regenerated
        run: node scripts/build-registry.mjs --check
      - name: Validate registry schema
        run: node scripts/validate-registry.mjs
